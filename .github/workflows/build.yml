name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen source
        run: |
          mkdir -p work
          unzip -qo lananh-client-source-no-shader.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        working-directory: work
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: work/build/libs/*.jar
